<!DOCTYPE html>

<html lang="en">
<head>
<meta charset="utf-8"/>
<meta content="width=device-width,initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #000;
    }
  </style>
</head>
<body>
<!-- STITCH_THREEJS_START:ANIMATION_3 class="fixed inset-0 w-full h-full bg-transparent" -->
<div class="fixed inset-0 w-full h-full bg-transparent" style="display:block;">
<script src="https://ajax.googleapis.com/ajax/libs/threejs/r125/three.min.js"></script>
<div id="threejs-container-ANIMATION_3" style="width:100%;height:100%"></div>
<script>
(function() {
  const container = document.getElementById('threejs-container-ANIMATION_3');
  const devicePixelRatio = window.devicePixelRatio || 1;
  // Interactive 3D Laser Light Prism & Beauty Crystal Scene for Grande Clinic Tabarbour
const width = container.clientWidth || window.innerWidth;
const height = container.clientHeight || window.innerHeight;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(45, width / height, 0.1, 1000);
camera.position.set(0, 0, 8);

const renderer = new THREE.WebGLRenderer({ alpha: true, antialias: true });
renderer.setSize(width, height);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
container.appendChild(renderer.domElement);

// Lighting
const ambientLight = new THREE.AmbientLight(0xfff5ea, 1.2);
scene.add(ambientLight);

const dirLight1 = new THREE.DirectionalLight(0xd4af37, 2.5); // Champagne Gold
dirLight1.position.set(5, 5, 5);
scene.add(dirLight1);

const dirLight2 = new THREE.DirectionalLight(0x38bdf8, 1.8); // Precision Laser Cyan
dirLight2.position.set(-5, -3, 3);
scene.add(dirLight2);

const pointLight = new THREE.PointLight(0xffdf80, 2, 10);
pointLight.position.set(0, 0, 2);
scene.add(pointLight);

// Group for master 3D centerpiece
const clinicGroup = new THREE.Group();
scene.add(clinicGroup);

// Central Faceted Laser Crystal / Medical Diamond Gem
const gemGeo = new THREE.OctahedronGeometry(1.6, 2);
const gemMat = new THREE.MeshPhongMaterial({
  color: 0xfbf8f3,
  emissive: 0x1a2e26,
  specular: 0xffffff,
  shininess: 120,
  transparent: true,
  opacity: 0.88,
  wireframe: false
});
const gemMesh = new THREE.Mesh(gemGeo, gemMat);
clinicGroup.add(gemMesh);

// Delicate Wireframe Outer Halo
const wireMat = new THREE.MeshBasicMaterial({
  color: 0xd4af37,
  wireframe: true,
  transparent: true,
  opacity: 0.35
});
const wireMesh = new THREE.Mesh(gemGeo, wireMat);
wireMesh.scale.set(1.05, 1.05, 1.05);
clinicGroup.add(wireMesh);

// Concentric Orbiting Golden Precision Rings (representing laser calibration)
const ringGeo1 = new THREE.TorusGeometry(2.5, 0.025, 16, 100);
const ringMat1 = new THREE.MeshStandardMaterial({
  color: 0xc5a059,
  metalness: 0.7,
  roughness: 0.2
});
const ring1 = new THREE.Mesh(ringGeo1, ringMat1);
ring1.rotation.x = Math.PI / 3;
clinicGroup.add(ring1);

const ringGeo2 = new THREE.TorusGeometry(3.0, 0.02, 16, 100);
const ringMat2 = new THREE.MeshStandardMaterial({
  color: 0x25d366,
  metalness: 0.4,
  roughness: 0.3,
  transparent: true,
  opacity: 0.6
});
const ring2 = new THREE.Mesh(ringGeo2, ringMat2);
ring2.rotation.y = Math.PI / 4;
ring2.rotation.x = -Math.PI / 6;
clinicGroup.add(ring2);

// Shimmering Floating Laser Light Photons / Particles
const particleCount = 70;
const particleGeo = new THREE.BufferGeometry();
const positions = new Float32Array(particleCount * 3);
const scales = new Float32Array(particleCount);

for (let i = 0; i < particleCount; i++) {
  const theta = Math.random() * Math.PI * 2;
  const phi = Math.acos((Math.random() * 2) - 1);
  const r = 2.2 + Math.random() * 2.8;

  positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
  positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
  positions[i * 3 + 2] = r * Math.cos(phi);
  scales[i] = Math.random() * 0.06 + 0.02;
}

particleGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));

// Create small glowing spheres for laser energy pulses
const pMat = new THREE.MeshStandardMaterial({
  color: 0xffe6a3,
  emissive: 0xd4af37,
  roughness: 0.1
});
const particlesInstanced = new THREE.Group();
for (let i = 0; i < 40; i++) {
  const pMesh = new THREE.Mesh(new THREE.SphereGeometry(0.04 + Math.random() * 0.04, 8, 8), pMat);
  pMesh.position.set(
    (Math.random() - 0.5) * 6,
    (Math.random() - 0.5) * 6,
    (Math.random() - 0.5) * 4
  );
  pMesh.userData = {
    speedY: 0.003 + Math.random() * 0.006,
    initialY: pMesh.position.y
  };
  particlesInstanced.add(pMesh);
}
clinicGroup.add(particlesInstanced);

// Mouse interaction tracking
let mouseX = 0;
let mouseY = 0;
let targetX = 0;
let targetY = 0;

function onMouseMove(event) {
  const rect = container.getBoundingClientRect();
  mouseX = ((event.clientX - rect.left) / rect.width) * 2 - 1;
  mouseY = -(((event.clientY - rect.top) / rect.height) * 2 - 1);
}
window.addEventListener('mousemove', onMouseMove, { passive: true });

// Animation Loop
let clock = new THREE.Clock();
function animate() {
  requestAnimationFrame(animate);
  const elapsedTime = clock.getElapsedTime();

  // Smooth rotation
  targetX += (mouseX - targetX) * 0.05;
  targetY += (mouseY - targetY) * 0.05;

  clinicGroup.rotation.y = elapsedTime * 0.25 + targetX * 0.5;
  clinicGroup.rotation.x = Math.sin(elapsedTime * 0.2) * 0.15 - targetY * 0.3;

  ring1.rotation.z = elapsedTime * 0.4;
  ring2.rotation.z = -elapsedTime * 0.35;

  // Pulse central gem
  const pulse = 1 + Math.sin(elapsedTime * 1.8) * 0.04;
  gemMesh.scale.set(pulse, pulse, pulse);

  // Animate floating particles
  particlesInstanced.children.forEach((p, idx) => {
    p.position.y += p.userData.speedY;
    if (p.position.y > 3) p.position.y = -3;
    p.position.x += Math.sin(elapsedTime + idx) * 0.002;
  });

  renderer.render(scene, camera);
}
animate();

// Resize handler
function onWindowResize() {
  const newWidth = container.clientWidth || window.innerWidth;
  const newHeight = container.clientHeight || window.innerHeight;
  camera.aspect = newWidth / newHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(newWidth, newHeight);
}
window.addEventListener('resize', onWindowResize);

})();
</script>
</div>
<!-- STITCH_THREEJS_END:ANIMATION_3 -->
</body>
</html>
